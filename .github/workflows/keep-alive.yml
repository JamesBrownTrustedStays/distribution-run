name: Keep Supabase awake

on:
  schedule:
    # Runs daily at 09:30 UTC (was previously every 3 days — Supabase needs more frequent activity)
    - cron: '30 9 * * *'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query public_leaderboard (real DB read)
        run: |
          echo "Pinging Supabase public_leaderboard…"
          response=$(curl --silent --show-error --fail --write-out "\nHTTP_STATUS:%{http_code}\n" \
            -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/public_leaderboard?select=id&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "$response"

      - name: Query marketing_consent (second real DB read)
        run: |
          echo "Pinging Supabase marketing_consent…"
          response=$(curl --silent --show-error --fail --write-out "\nHTTP_STATUS:%{http_code}\n" \
            -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/marketing_consent?select=id&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "$response"

      - name: Done
        run: echo "Keep-alive completed successfully at $(date)"
