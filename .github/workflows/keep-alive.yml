name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 */3 * *'   # noon UTC every 3 days
  workflow_dispatch:           # also lets you trigger it manually from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://amilxsitswbyeyrpfznc.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging $SUPABASE_URL..."
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/public_leaderboard?select=id&limit=1")
          echo "Response: $response"
          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Pinged Supabase successfully (HTTP $status)"
          else
            echo "Ping failed with HTTP $status"
            exit 1
          fi
